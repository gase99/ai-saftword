name: Live provider validation

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to test (requires its protected environment secret)
        required: true
        type: choice
        options: [OPENAI, ANTHROPIC, GEMINI, OLLAMA]
      endpoint:
        description: Ollama HTTPS tunnel URL only (public CI cannot reach your phone/LAN)
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: provider-validation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run selected real-provider smoke test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_ENDPOINT: ${{ inputs.endpoint }}
          SELECTED: ${{ inputs.provider }}
        run: |
          METHOD=$(echo "$SELECTED" | tr '[:upper:]' '[:lower:]')
          ./gradlew --no-daemon :core:testDebugUnitTest -DliveProviders=true --tests "com.aicode.glass.core.LiveProviderTest.$METHOD"
      - name: Report actual validation scope
        if: always()
        run: |
          echo '## Live provider validation' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only the explicitly selected smoke test ran. Other providers are skipped, not verified. Check test reports for executed/skipped status.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: live-provider-report-${{ github.run_id }}
          path: core/build/reports/tests/
          if-no-files-found: warn
