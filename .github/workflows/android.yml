name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Test and build
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Upload installable debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AiCode-Glass-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AiCode-Glass-reports-${{ github.sha }}
          path: |
            app/build/reports/
            core/build/reports/
            terminal-emulator/build/reports/
            terminal-view/build/reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Add download instructions to job summary
        if: success()
        run: |
          echo '## AiCode Glass APK is ready' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download **AiCode-Glass-debug-${{ github.sha }}** from the Artifacts section of this run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Extract the ZIP and install the APK. This is a debug build, not a signed store release.' >> "$GITHUB_STEP_SUMMARY"
